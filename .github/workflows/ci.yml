name: LogiPulse AI - Continuous Integration (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Run Unit Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests Across All Services
        run: pnpm test:all

      - name: Build Next.js Web App
        run: pnpm --filter @logipulse/web build

  docker-build-check:
    name: Verify Docker Images Compilation
    needs: test-and-verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build orders-service Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/orders-service/Dockerfile
          push: false
          tags: logipulse/orders-service:latest

      - name: Build telemetry-service Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/telemetry-service/Dockerfile
          push: false
          tags: logipulse/telemetry-service:latest

      - name: Build ai-analytics-service Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/ai-analytics-service/Dockerfile
          push: false
          tags: logipulse/ai-analytics-service:latest

      - name: Build web Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: logipulse/web:latest
