version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: logipulse_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logipulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logipulse_password}
      POSTGRES_DB: ${POSTGRES_DB:-logipulse_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logipulse_user} -d ${POSTGRES_DB:-logipulse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6-jammy
    container_name: logipulse_mongodb_prod
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: logipulse_rabbitmq_prod
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  orders-service:
    build:
      context: .
      dockerfile: apps/orders-service/Dockerfile
    container_name: logipulse_orders_service_prod
    restart: always
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-logipulse_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-logipulse_password}
      DB_NAME: ${POSTGRES_DB:-logipulse_db}
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  telemetry-service:
    build:
      context: .
      dockerfile: apps/telemetry-service/Dockerfile
    container_name: logipulse_telemetry_service_prod
    restart: always
    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongodb:27017/logipulse_telemetry
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "3002:3002"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai-analytics-service:
    build:
      context: .
      dockerfile: apps/ai-analytics-service/Dockerfile
    container_name: logipulse_ai_analytics_service_prod
    restart: always
    environment:
      PORT: 3003
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-groq/compound-mini}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "3003:3003"
    depends_on:
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: logipulse_web_prod
    restart: always
    environment:
      PORT: 3000
      NEXT_PUBLIC_ORDERS_API: http://localhost:3001
      NEXT_PUBLIC_TELEMETRY_API: http://localhost:3002
      NEXT_PUBLIC_TELEMETRY_WS: http://localhost:3002
      NEXT_PUBLIC_AI_API: http://localhost:3003
    ports:
      - "3000:3000"
    depends_on:
      - orders-service
      - telemetry-service
      - ai-analytics-service

volumes:
  postgres_data_prod:
  mongodb_data_prod:
