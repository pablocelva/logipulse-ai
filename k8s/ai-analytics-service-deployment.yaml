apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-analytics-service-deployment
  namespace: logipulse-ai
  labels:
    app: ai-analytics-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-analytics-service
  template:
    metadata:
      labels:
        app: ai-analytics-service
    spec:
      containers:
        - name: ai-analytics-service
          image: logipulse/ai-analytics-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: logipulse-secrets
                  key: GROQ_API_KEY
            - name: GROQ_MODEL
              valueFrom:
                configMapKeyRef:
                  name: logipulse-config
                  key: GROQ_MODEL
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: logipulse-secrets
                  key: TAVILY_API_KEY
            - name: RABBITMQ_URI
              valueFrom:
                secretKeyRef:
                  name: logipulse-secrets
                  key: RABBITMQ_URI
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-analytics-service
  namespace: logipulse-ai
spec:
  selector:
    app: ai-analytics-service
  ports:
    - port: 3003
      targetPort: 3003
